<!--  Hotove po ulohu 6  -->

<mat-card class="cart-card">

    <mat-card-header>
    
    <mat-card-title>
    <mat-icon>shopping_cart</mat-icon>
    Moje výpožičky
    </mat-card-title>
    
    <mat-card-subtitle>
    Požičané knihy: {{ books().length }}
    </mat-card-subtitle>
    
    </mat-card-header>
    
    <mat-card-content>
    
    @for (book of books(); track book.id) {
    
    <div class="cart-item">
    <span>{{ book.title }}</span>
    
    <button
    matButton="outlined"
    (click)="giveBack(book)">
    Vrátiť
    </button>
    </div>
    
    } @empty {
    
    <p>Zatiaľ nemáš požičanú žiadnu knihu.</p>

    }
    
    </mat-card-content>
    
    </mat-card>
