<div class="admin-edit-container" style="padding: 24px; max-width: 600px; margin: 0 auto;">
    <nav style="margin-bottom: 20px;">
      <a mat-button routerLink="/admin">
        <mat-icon>arrow_back</mat-icon> Späť do administrácie
      </a>
    </nav>
  
    @if (loading()) {
      <p role="status">Načítavam knihy…</p>
    } @else if (loadError()) {
      <p role="alert">{{ loadError() }}</p>
    } @else if (!isEditMode()) {
      <h1>Nová kniha</h1>
      <app-book-form (saved)="save($event)" />
    } @else if (book()) {
      <h1>Úprava knihy</h1>
      <app-book-form [book]="book()" (saved)="save($event)" (cancelled)="cancel()" />
    } @else {
      <p class="empty">Kniha s číslom {{ id() }} v knižnici neexistuje.</p>
    }
  </div>
